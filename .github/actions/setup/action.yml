name: Setup
description: Setup Node.js and install dependencies

inputs:
  GH_TOKEN:
    description: 'GH_TOKEN necessary to install dependencies'

runs:
  using: composite
  steps:
    - name: Configure Git
      shell: sh
      run: |
        git config --global --add url."https://x-access-token:${{ inputs.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global --add url."https://x-access-token:${{ inputs.GH_TOKEN }}@github.com/".insteadOf "git://github.com/"

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        cache: yarn
        node-version-file: .nvmrc
        scope: '@lawnstarter'

    - name: Set registry authToken
      shell: sh
      run: echo "//npm.pkg.github.com/:_authToken=${{ inputs.GH_TOKEN }}" >> ./.npmrc;

    - name: Cache dependencies
      id: yarn-cache
      uses: actions/cache@v5
      with:
        path: |
          **/node_modules
        # Node version in the key: native modules built under one Node must not be restored under another
        key: ${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-yarn-

    - name: Install dependencies
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      run: yarn install --immutable
      shell: bash
